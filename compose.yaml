# ---------------------------------------------------------------------------
# Nazbeen Academy Binary Ai Asisstance — local development / staging stack
#
#   cp .env.example .env       # then edit values
#   docker compose up --build
#
# Services
#   migrate    one-shot: applies migrations, then exits
#   web        ASGI (uvicorn) on http://localhost:8000
#   worker-*   Celery workers, isolated per queue
#   beat       Celery beat (retention purge schedules)
#   db         PostgreSQL 16   (bound to 127.0.0.1, NOT public)
#   redis      Redis 7, password-protected (bound to 127.0.0.1, NOT public)
#
# A production example lives in compose.prod.yaml.
# The Windows MT5 worker is intentionally NOT part of this file: it runs on a
# separate host with the MetaTrader 5 terminal. See docs/mt5_worker.md.
#
# No credential is written into this file: all secrets come from .env.
# ---------------------------------------------------------------------------
name: nazbeen-academy

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
  DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-nazbeen_academy}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  MT5_WORKER_TOKEN: ${MT5_WORKER_TOKEN:-}
  VISION_LLM_PROVIDER: ${VISION_LLM_PROVIDER:-mock}
  VISION_LLM_API_KEY: ${VISION_LLM_API_KEY:-}
  VISION_LLM_BASE_URL: ${VISION_LLM_BASE_URL:-}
  REASONING_LLM_PROVIDER: ${REASONING_LLM_PROVIDER:-mock}
  REASONING_LLM_API_KEY: ${REASONING_LLM_API_KEY:-}
  REASONING_LLM_BASE_URL: ${REASONING_LLM_BASE_URL:-}

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: nazbeen-academy:latest
  restart: unless-stopped
  environment: *app-environment
  # Never publish the app's ports from worker services.
  networks:
    - internal

# The image's HEALTHCHECK probes the web port, which only `web` ever listens
# on — inherited verbatim, a worker/beat container could never pass it and
# would show permanently unhealthy. These overrides check that PID 1 really is
# the celery process (the entrypoint execs it as PID 1; if it dies, the
# container exits and compose restarts it anyway).
x-celery-worker-healthcheck: &celery-worker-healthcheck
  test: ["CMD-SHELL", "grep -q worker /proc/1/cmdline"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

x-celery-beat-healthcheck: &celery-beat-healthcheck
  test: ["CMD-SHELL", "grep -q beat /proc/1/cmdline"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # -- One-shot migrations ---------------------------------------------------
  migrate:
    <<: *app-base
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    # Exits within seconds; the inherited web-port probe is meaningless here.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  # -- Static files (run once, before web) -----------------------------------
  collectstatic:
    <<: *app-base
    restart: "no"
    command: ["python", "manage.py", "collectstatic", "--noinput"]
    healthcheck:
      disable: true
    depends_on:
      - migrate

  # -- Web (ASGI) ------------------------------------------------------------
  web:
    <<: *app-base
    ports:
      # Bound to loopback: expose only through your reverse proxy in production.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      collectstatic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # -- Celery workers (one queue group per service) --------------------------
  worker-market:
    <<: *app-base
    command: ["celery", "-A", "config", "worker", "-Q", "market,default", "-c", "2", "--max-tasks-per-child", "50"]
    healthcheck: *celery-worker-healthcheck
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-vision:
    <<: *app-base
    # Screenshot analysis is CPU/memory bound (Pillow + provider call):
    # a single concurrent task bounds peak memory.
    command: ["celery", "-A", "config", "worker", "-Q", "vision", "-c", "1", "--max-tasks-per-child", "20"]
    healthcheck: *celery-worker-healthcheck
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-backtest:
    <<: *app-base
    # Long-running, low-volume: keep concurrency at 1 so a burst of backtests
    # cannot exhaust the host.
    command: ["celery", "-A", "config", "worker", "-Q", "backtest", "-c", "1", "--max-tasks-per-child", "5"]
    healthcheck: *celery-worker-healthcheck
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-assistant:
    <<: *app-base
    command: ["celery", "-A", "config", "worker", "-Q", "assistant", "-c", "2", "--max-tasks-per-child", "50"]
    healthcheck: *celery-worker-healthcheck
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *app-base
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck: *celery-beat-healthcheck
    depends_on:
      redis:
        condition: service_healthy

  # -- Data stores (loopback only, never public) -----------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nazbeen_academy}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password + no public port: Redis must never be reachable from the
    # internet. `--maxmemory` bounds cache growth; `appendonly` preserves
    # Celery task state across restarts.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # -- Optional: backup job (run manually) -----------------------------------
  #   docker compose run --rm backup
  backup:
    <<: *app-base
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["/bin/sh", "/app/docker/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
    # No `ports:` on this network's services other than the loopback bindings
    # above, so nothing is exposed beyond the host.
