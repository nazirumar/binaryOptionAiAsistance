{% comment %}
Theme toggle — flips between light and dark. The button carries an aria-pressed
state (dark = pressed) that static/js/theme.js keeps in sync.
{% endcomment %}
<button
  type="button"
  id="theme-toggle"
  class="btn btn-ghost btn-icon tooltip"
  data-tooltip="Toggle theme"
  aria-label="Toggle dark mode"
  aria-pressed="{{ theme|yesno:'false,false' }}"
>
  <svg class="h-5 w-5 dark:hidden" aria-hidden="true"><use href="#icon-moon"></use></svg>
  <svg class="hidden h-5 w-5 dark:block" aria-hidden="true"><use href="#icon-sun"></use></svg>
</button>
