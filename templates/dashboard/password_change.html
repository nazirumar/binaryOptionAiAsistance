{% extends "dashboard/layout.html" %}
{% block title %}Change password · {{ app_name }}{% endblock %}
{% block page_content %}
<h1 class="text-2xl font-bold">Change password</h1>

<section class="mt-6 rounded-xl border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900">
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex items-center gap-3">
      <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">Update password</button>
      <a href="{% url 'dashboard:settings' %}" class="text-sm text-slate-500 hover:underline">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
